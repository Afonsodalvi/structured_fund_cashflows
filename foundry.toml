[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["lib"]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
build_info = true
extra_output = ["storageLayout"]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 96
fail_on_revert = true

[profile.ci.fuzz]
runs = 2048

[profile.ci.invariant]
runs = 256
depth = 128
fail_on_revert = true
