[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["lib"]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]
solc_version = "0.8.37"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
via_ir = true
build_info = true
dynamic_test_linking = false
extra_output = ["storageLayout"]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 96
fail_on_revert = true

[profile.ci.fuzz]
runs = 4096

[profile.ci.invariant]
runs = 512
depth = 256
fail_on_revert = true
